[project]
name = "cluster"
version = "0.1.0"
description = "Chemical tagging of star clusters: benchmark t-SNE vs UMAP vs EVoC"
readme = "README.md"
authors = [
    { name = "R. Garcia-Dias", email = "rafaelagd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=6",
    "numpy>=2",
    "scipy>=1.11",
    "pandas>=2",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "evoc>=0.1",
    "matplotlib>=3.9",
    "click>=8",
    "pydantic>=2.10",
    "pandera>=0.30",
    "mlflow>=3",
    "opentsne>=1.0.4",
    "astroquery>=0.4.11",
    "plotly<6",
    "asteca>=0.7.0",
    "emcee>=3.1.6",
    "requests>=2.34.2",
    "lxml>=6.1.2",
    "huggingface_hub>=0.34",
    # JupyterLab is the notebook front end: ipywidgets drives the controls,
    # ipympl the matplotlib figures, and nbformat/nbclient/nbconvert execute and
    # validate the notebooks headless (scripts + CI).
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "ipympl>=0.9.4",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "nbconvert>=7.16",
]

[project.optional-dependencies]
# Only the spectral re-embedding / figure scripts need torch:
#   uv sync --extra torch
torch = ["torch>=2.6"]

# PyPI's default torch wheel for Linux bundles ~3 GB of CUDA libraries; the
# workshop needs none of it. Pinning the extra to the CPU wheel index keeps the
# install ~200 MB on Linux, macOS and Windows alike.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project.scripts]
cluster = "cluster.cli:main"

[dependency-groups]
dev = [
    "pyrefly>=1.2",
    "pytest>=9",
    "pytest-cov>=6",
    "coverage>=7",
    "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --------------------------------------------------------------------------- #
# Type checking (pyrefly)
# --------------------------------------------------------------------------- #
[tool.pyrefly]
preset = "strict"
python-version = "3.13"
project-includes = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py"]
project-excludes = [
    "**/__pycache__",
    ".venv/**",
    "data/**",
    "results/**",
    "docs/**",
    "ref/**",
    "mlruns/**",
    # WIP deck-generation assets (untyped by design)
    "scripts/teaching_assets/**",
    "scripts/make_teaching_assets.py",
    # vendored third-party CMD downloader (untyped)
    "src/cluster/_parsec.py",
    # hand-run downloader for the upstream DR17 spectra (network + optional deps)
    "scripts/parallel_download.py",
]
search-path = ["src"]

# --------------------------------------------------------------------------- #
# Linting (ruff)
# --------------------------------------------------------------------------- #
# Tuned to the code that exists rather than to ruff's defaults: the rules turned
# off below all fire on deliberate, correct choices in this codebase, and a gate
# that flags correct code is a gate people learn to ignore.
[tool.ruff]
target-version = "py313"
# The code is written to ~79 columns (95th percentile is exactly 79). This cap
# is the runaway-line gate, not a style target — tightening it to 79 would flag
# 1,609 existing lines and teach everyone to add noqa.
line-length = 120
extend-exclude = [
    "scripts/teaching_assets",
    "scripts/make_teaching_assets.py",
    "src/cluster/_parsec.py",
    "scripts/parallel_download.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RET", "UP", "PTH", "PLE"]
ignore = [
    # The cluster catalogue in src/cluster/clusters.py is a column-aligned
    # table; the alignment is what makes 25 rows of coordinates readable.
    "E221", "E241",
    # `zip()` without strict= is fine where the lengths are established by
    # construction a line or two above.
    "B905",
    # `dict(arrowstyle=…, color=…)` is how matplotlib kwargs are conventionally
    # written; rewriting 34 of them as literals buys nothing.
    "C408",
]

[tool.ruff.lint.per-file-ignores]
# Tests bind intermediates for readability and shadow names deliberately.
"tests/**" = ["F841"]
# Figure scripts are plotting DSLs: long styling calls and os.path are normal.
"scripts/make_*_figures.py" = ["E501", "PTH"]
# __all__ is built from the lazy-import table, so it is a sorted() list rather
# than a literal. Valid at runtime; ruff only wants one it can read statically.
"src/cluster/models/__init__.py" = ["PLE0605"]
# The float counter is incremented before use and read after the loop body
# branches; enumerate() would obscure that.
"scripts/make_exercise_notebooks.py" = ["SIM113"]
# The nested `if` mirrors the FITS structure being walked (is it a table? does
# it have rows? is it the biggest so far?) and reads better split.
"src/cluster/data.py" = ["SIM102"]

# --------------------------------------------------------------------------- #
# Tests + coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["cluster"]
branch = true
omit = [
    # vendored third-party CMD downloader
    "**/_parsec.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
