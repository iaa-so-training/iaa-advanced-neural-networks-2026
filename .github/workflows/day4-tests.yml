name: day4 tests

# The Day 4 package has 705 tests; this workflow runs the ones that need no real
# data — synthetic fixtures only — so it is a cheap gate on every change under
# day_4_clustering/. The 476 workbook-exercise tests are part of that: the two
# that read the DR19 catalogue carry a `needs_data` skip, and everything else
# (module contracts, the citation keys resolving against article/references.bib,
# and every shipped notebook cell compiling) runs dataless.
#
# The optional torch extra and the PARSEC grid are skipped here. Measured on a
# clean environment with no catalogue: 703 passed, 3 skipped, ~5 min.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "day_4_clustering/**"
      - ".github/workflows/day4-tests.yml"
  push:
    branches: [main]
    paths:
      - "day_4_clustering/**"
      - ".github/workflows/day4-tests.yml"

# A second push to the same PR makes the first run pointless; stop it rather
# than pay for both. Never cancel a run on main — those gate the image build.
concurrency:
  group: day4-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: day_4_clustering
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: install
        run: uv sync --frozen

      - name: tests
        run: uv run pytest -q

      # The decks are generated from src/exercises, so the text a student is
      # asked to run can fall out of step with the modules. This catches drift
      # in anything rendered into a deck — the workbook prose and the scratch
      # cell's imports — which is where an exercise once shipped telling
      # students to `import as`. (Module internals are covered by pytest, not
      # here: changing a module body alone does not change the decks.)
      - name: notebook decks match the exercise modules
        run: uv run python scripts/make_exercise_notebooks.py --check

      - name: lint
        run: uv run ruff check src scripts tests

      # Pyrefly's strict preset is not clean on this codebase yet, so a plain
      # `pyrefly check` would be red on every PR and quickly ignored. Instead it
      # is a ratchet: the count may fall freely, but a PR that raises it fails.
      # Lower PYREFLY_CEILING whenever you drive the number down — that is the
      # whole mechanism, and it only works if the ceiling follows the floor.
      - name: type check (ratchet — the error count may not rise)
        env:
          PYREFLY_CEILING: "59"
        run: |
          set -o pipefail
          out=$(uv run pyrefly check 2>&1) || true
          echo "$out"
          errors=$(printf '%s\n' "$out" | sed -n 's/.*INFO \([0-9]\+\) error.*/\1/p' | tail -1)
          if [ -z "$errors" ]; then
            echo "::error::could not parse an error count from pyrefly — treating as a failure"
            exit 1
          fi
          echo "pyrefly errors: $errors (ceiling $PYREFLY_CEILING)"
          if [ "$errors" -gt "$PYREFLY_CEILING" ]; then
            echo "::error::pyrefly errors rose to $errors, above the ceiling of $PYREFLY_CEILING"
            exit 1
          fi
          if [ "$errors" -lt "$PYREFLY_CEILING" ]; then
            echo "::notice::pyrefly errors down to $errors — lower PYREFLY_CEILING in this workflow"
          fi
